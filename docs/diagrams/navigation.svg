<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Segoe UI, Arial, sans-serif" fill="#1f2933"><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#1f2933" stroke-width="1.4"/></marker></defs><rect width="1100" height="720" fill="#ffffff"/><text x="550.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" >MediMind Screen Navigation Diagram</text><rect x="50.0" y="117.0" width="200" height="66" rx="12" fill="#f4f7fb" stroke="#1f2933" stroke-width="1.8" stroke-dasharray="7 5"/><text x="150" y="146" font-size="16" font-weight="bold" text-anchor="middle" >Reminder notification</text><text x="150" y="168" font-size="12" font-weight="normal" text-anchor="middle" fill="#52606d" >system notification</text><rect x="450.0" y="117.0" width="200" height="66" rx="12" fill="#dbe7f5" stroke="#1f2933" stroke-width="1.8"/><text x="550" y="146" font-size="16" font-weight="bold" text-anchor="middle" >Today</text><text x="550" y="168" font-size="12" font-weight="normal" text-anchor="middle" fill="#52606d" >TodayActivity</text><rect x="230.0" y="317.0" width="200" height="66" rx="12" fill="#dbe7f5" stroke="#1f2933" stroke-width="1.8"/><text x="330" y="346" font-size="16" font-weight="bold" text-anchor="middle" >Medications</text><text x="330" y="368" font-size="12" font-weight="normal" text-anchor="middle" fill="#52606d" >MedicationsActivity</text><rect x="700.0" y="317.0" width="200" height="66" rx="12" fill="#dbe7f5" stroke="#1f2933" stroke-width="1.8"/><text x="800" y="346" font-size="16" font-weight="bold" text-anchor="middle" >Report</text><text x="800" y="368" font-size="12" font-weight="normal" text-anchor="middle" fill="#52606d" >ReportActivity</text><rect x="90.0" y="537.0" width="200" height="66" rx="12" fill="#dbe7f5" stroke="#1f2933" stroke-width="1.8"/><text x="190" y="566" font-size="16" font-weight="bold" text-anchor="middle" >Medication Detail</text><text x="190" y="588" font-size="12" font-weight="normal" text-anchor="middle" fill="#52606d" >MedicationDetailActivity</text><rect x="460.0" y="537.0" width="200" height="66" rx="12" fill="#dbe7f5" stroke="#1f2933" stroke-width="1.8"/><text x="560" y="566" font-size="16" font-weight="bold" text-anchor="middle" >Medication Form</text><text x="560" y="588" font-size="12" font-weight="normal" text-anchor="middle" fill="#52606d" >MedicationFormActivity</text><circle cx="550" cy="62" r="8" fill="#1f2933"/><line x1="550" y1="70" x2="550" y2="115.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><text x="574" y="74" font-size="12" font-weight="normal" text-anchor="start" fill="#52606d" >app starts</text><line x1="250.0" y1="150.0" x2="450.0" y2="150.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><rect x="270.1" y="102.0" width="159.8" height="36.0" fill="#ffffff" opacity="0.95"/><text x="350.0" y="115.0" font-size="12" font-weight="normal" text-anchor="middle" >tap</text><text x="350.0" y="130.0" font-size="12" font-weight="normal" text-anchor="middle" >schedule_id, dose_date</text><line x1="513.7" y1="183.0" x2="366.3" y2="317.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><rect x="403.8" y="232.0" width="72.5" height="36.0" fill="#ffffff" opacity="0.95"/><text x="440.0" y="245.0" font-size="12" font-weight="normal" text-anchor="middle" >menu</text><text x="440.0" y="260.0" font-size="12" font-weight="normal" text-anchor="middle" >no extras</text><line x1="591.2" y1="183.0" x2="758.8" y2="317.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><rect x="638.8" y="232.0" width="72.5" height="36.0" fill="#ffffff" opacity="0.95"/><text x="675.0" y="245.0" font-size="12" font-weight="normal" text-anchor="middle" >menu</text><text x="675.0" y="260.0" font-size="12" font-weight="normal" text-anchor="middle" >no extras</text><line x1="364.5" y1="383.0" x2="525.5" y2="537.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><rect x="411.8" y="442.0" width="146.4" height="36.0" fill="#ffffff" opacity="0.95"/><text x="485.0" y="455.0" font-size="12" font-weight="normal" text-anchor="middle" >+ button</text><text x="485.0" y="470.0" font-size="12" font-weight="normal" text-anchor="middle" >no extras (add mode)</text><line x1="290.0" y1="570.0" x2="460.0" y2="570.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><rect x="325.3" y="522.0" width="99.4" height="36.0" fill="#ffffff" opacity="0.95"/><text x="375.0" y="535.0" font-size="12" font-weight="normal" text-anchor="middle" >Edit</text><text x="375.0" y="550.0" font-size="12" font-weight="normal" text-anchor="middle" >medication_id</text><line x1="322.0" y1="383.0" x2="252.0" y2="537.0" stroke="#1f2933" stroke-width="1.8" marker-end="url(#solid)"/><rect x="302.3" y="444.0" width="99.4" height="36.0" fill="#ffffff" opacity="0.95"/><text x="352.0" y="457.0" font-size="12" font-weight="normal" text-anchor="middle" >tap a row</text><text x="352.0" y="472.0" font-size="12" font-weight="normal" text-anchor="middle" >medication_id</text><line x1="160.0" y1="537.0" x2="234.0" y2="383.0" stroke="#1f2933" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#solid)"/><rect x="36.8" y="444.0" width="146.4" height="36.0" fill="#ffffff" opacity="0.95"/><text x="110.0" y="457.0" font-size="12" font-weight="normal" text-anchor="middle" >Delete, then confirm</text><text x="110.0" y="472.0" font-size="12" font-weight="normal" text-anchor="middle" >finish()</text><path d="M 660 537 C 740 470 650 395 432 362" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#solid)"/><rect x="669.0" y="432.0" width="106.1" height="36.0" fill="#ffffff" opacity="0.95"/><text x="722.0" y="445.0" font-size="12" font-weight="normal" text-anchor="middle" >Save or Cancel</text><text x="722.0" y="460.0" font-size="12" font-weight="normal" text-anchor="middle" >finish()</text><text x="40" y="652" font-size="13" font-weight="normal" text-anchor="start" fill="#3e4c59" >Solid arrow: explicit Intent. The extras it carries are written on the arrow.</text><text x="40" y="672" font-size="13" font-weight="normal" text-anchor="start" fill="#3e4c59" >Dashed arrow: the screen closes with finish() and the previous screen reloads in onResume.</text><text x="40" y="692" font-size="13" font-weight="normal" text-anchor="start" fill="#3e4c59" >Medication Form is opened from Medications (add) and from Medication Detail (edit). Save or Cancel returns to whichever opened it.</text><text x="40" y="712" font-size="13" font-weight="normal" text-anchor="start" fill="#3e4c59" >The Back button on every screen returns to the previous screen.</text></svg>