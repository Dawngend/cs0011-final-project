"82" fill="#f4f7fb" stroke="#b8c4d2"/><text x="54" y="541" font-size="13" font-weight="bold" text-anchor="start" >Line ends</text><line x1="100" y1="562" x2="100" y2="580" stroke="#1f2933" stroke-width="1.8"/><line x1="108" y1="562" x2="108" y2="580" stroke="#1f2933" stroke-width="1.8"/><line x1="86" y1="571" x2="130" y2="571" stroke="#1f2933" stroke-width="1.6"/><text x="142" y="576" font-size="13" font-weight="normal" text-anchor="start" >exactly one</text><line x1="260" y1="571" x2="310" y2="571" stroke="#1f2933" stroke-width="1.6"/><line x1="294" y1="571" x2="310" y2="562" stroke="#1f2933" stroke-width="1.8"/><line x1="294" y1="571" x2="310" y2="571" stroke="#1f2933" stroke-width="1.8"/><line x1="294" y1="571" x2="310" y2="580" stroke="#1f2933" stroke-width="1.8"/><line x1="288" y1="562" x2="288" y2="580" stroke="#1f2933" stroke-width="1.8"/><text x="322" y="576" font-size="13" font-weight="normal" text-anchor="start" >one or many</text><line x1="450" y1="571" x2="500" y2="571" stroke="#1f2933" stroke-width="1.6"/><line x1="484" y1="571" x2="500" y2="562" stroke="#1f2933" stroke-width="1.8"/><line x1="484" y1="571" x2="500" y2="571" stroke="#1f2933" stroke-width="1.8"/><line x1="484" y1="571" x2="500" y2="580" stroke="#1f2933" stroke-width="1.8"/><circle cx="474" cy="571" r="5" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/><text x="512" y="576" font-size="13" font-weight="normal" text-anchor="start" >zero or many</text></svg>