<text x="94" y="93" font-size="15" fill="#555555" font-weight="normal" text-anchor="start" font-style="italic">Medicine name</text>
<text x="84" y="128" font-size="14" fill="#222222" font-weight="bold" text-anchor="start">Enter the medicine name.</text>
<text x="16" y="169" font-size="14" fill="#555555" font-weight="bold" text-anchor="start">Dose</text>
