<text x="16" y="221" font-size="14" fill="#555555" font-weight="bold" text-anchor="start">Notes</text>
<rect x="84" y="196" width="260" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="94" y="221" font-size="15" fill="#222222" font-weight="normal" text-anchor="start">After meals</text>
<text x="16" y="273" font-size="14" fill="#555555" font-weight="bold" text-anchor="start">Start</text>
<rect x="84" y="248" width="260" height="38" rx="6" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="94" y="273" font-size="15" fill="#222222" font-weight="normal" text-anchor="start">Oct 21, 2026</text>
