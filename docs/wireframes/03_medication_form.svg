<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Medication form screen</title>
<desc id="d">Add or edit a medicine. Fields: name, dose, notes, start, end, times and weekday chips. Name shows an example validation error.</desc>
<rect x="0" y="0" width="360" height="640" fill="#ffffff"/>
<path d="M1 56 V19 a18 18 0 0 1 18 -18 H341 a18 18 0 0 1 18 18 V56 Z" fill="#d6d6d6" stroke="#8a8a8a" stroke-width="1.5"/>
